<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Wings / Laurel -->
  <g fill="url(#wingGrad)" filter="url(#glow)">
    <!-- Feather 1 Top -->
    <path d="M72 45C55 35 30 40 20 48C28 58 48 58 68 56Z" opacity="0.95"/>
    <!-- Feather 2 -->
    <path d="M70 58C50 52 22 62 12 74C24 82 46 76 67 69Z" opacity="0.9"/>
    <!-- Feather 3 -->
    <path d="M72 72C52 70 26 84 20 98C32 102 54 92 70 82Z" opacity="0.85"/>
    <!-- Feather 4 Bottom -->
    <path d="M76 85C62 88 40 102 38 116C50 116 66 104 77 94Z" opacity="0.8"/>
  </g>

  <!-- Right Wings / Laurel (Mirrored) -->
  <g fill="url(#wingGrad)" filter="url(#glow)">
    <!-- Feather 1 Top -->
    <path d="M128 45C145 35 170 40 180 48C172 58 152 58 132 56Z" opacity="0.95"/>
    <!-- Feather 2 -->
    <path d="M130 58C150 52 178 62 188 74C176 82 154 76 133 69Z" opacity="0.9"/>
    <!-- Feather 3 -->
    <path d="M128 72C148 70 174 84 180 98C168 102 146 92 130 82Z" opacity="0.85"/>
    <!-- Feather 4 Bottom -->
    <path d="M124 85C138 88 160 102 162 116C150 116 134 104 123 94Z" opacity="0.8"/>
  </g>

  <!-- Center Golden Shield -->
  <path d="M100 25L68 37V78C68 102 82 120 100 126C118 120 132 102 132 78V37L100 25Z" fill="#13192B" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M100 32L74 42V78C74 98 85 113 100 118C115 113 126 98 126 78V42L100 32Z" stroke="#FDE047" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Golden Stars & Radiance -->
  <circle cx="100" cy="18" r="3" fill="#FEF08A"/>
  <circle cx="58" cy="32" r="2" fill="#FDE047" opacity="0.8"/>
  <circle cx="142" cy="32" r="2" fill="#FDE047" opacity="0.8"/>
</svg>
